# ===========================
# SonarQube Project Settings
# ===========================

sonar.projectKey=contact-management-system
sonar.projectName=Contact Management System
sonar.projectVersion=1.0.0

# Source encoding
sonar.sourceEncoding=UTF-8

# ===========================
# Backend module
# ===========================
sonar.modules=backend,frontend

backend.sonar.projectName=Contact Management - Backend
backend.sonar.projectBaseDir=backend
backend.sonar.sources=src/main/java
backend.sonar.tests=src/test/java
backend.sonar.java.binaries=target/classes
backend.sonar.java.test.binaries=target/test-classes
backend.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
backend.sonar.exclusions=**/ContactManagementApplication.java,**/*Config.java

# ===========================
# Frontend module
# ===========================
frontend.sonar.projectName=Contact Management - Frontend
frontend.sonar.projectBaseDir=frontend
frontend.sonar.sources=src
frontend.sonar.tests=src/__tests__
frontend.sonar.test.inclusions=**/*.test.js,**/*.test.jsx
frontend.sonar.exclusions=**/node_modules/**,**/build/**

# ===========================
# Quality Gate
# ===========================
sonar.qualitygate.wait=true
