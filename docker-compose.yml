version: '3.8'

# ============================================================
# Docker Compose — Contact Management System
# Development environment only
#
# Services:
#   - sqlserver   : Microsoft SQL Server 2022
#   - sonarqube   : SonarQube community edition
#   - sonardb     : PostgreSQL for SonarQube (internal)
#
# The Spring Boot backend and React frontend are run outside
# Docker during development (npm start / mvn spring-boot:run).
# ============================================================

services:

  # ----------------------------------------------------------
  # SQL Server
  # ----------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: contact_mgmt_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD:-YourPassword123!}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database/scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost",
             "-U", "sa", "-P", "${SA_PASSWORD:-YourPassword123!}",
             "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------
  # SonarQube
  # ----------------------------------------------------------
  sonarqube:
    image: sonarqube:10-community
    container_name: contact_mgmt_sonarqube
    depends_on:
      sonardb:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonardb:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: "${SONAR_DB_PASSWORD:-sonar}"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1",
             "--spider", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ----------------------------------------------------------
  # SonarQube Database (PostgreSQL)
  # ----------------------------------------------------------
  sonardb:
    image: postgres:15-alpine
    container_name: contact_mgmt_sonardb
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: "${SONAR_DB_PASSWORD:-sonar}"
      POSTGRES_DB: sonar
    volumes:
      - sonardb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sqlserver_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonardb_data:
