# ===========================
# Docker Profile
# Used when running inside a Docker container via docker compose.
# The hostname "sqlserver" resolves to the SQL Server container.
# ===========================

spring.datasource.url=jdbc:sqlserver://sqlserver:1433;databaseName=contact_management_db;encrypt=true;trustServerCertificate=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.com.contactmanagement=INFO
