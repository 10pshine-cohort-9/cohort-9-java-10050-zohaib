# ===========================
# Application Config
# ===========================
spring.application.name=contact-management-backend
server.port=8080

# ===========================
# SQL Server DataSource
# ===========================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=contact_management_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourPassword123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# JWT
# ===========================
app.jwt.secret=${JWT_SECRET:change-me-to-a-256-bit-secret-key-in-production}
app.jwt.expiration-ms=86400000

# ===========================
# Logging (SLF4J + Logback)
# ===========================
logging.level.root=INFO
logging.level.com.contactmanagement=DEBUG
logging.file.name=logs/contact-management.log
